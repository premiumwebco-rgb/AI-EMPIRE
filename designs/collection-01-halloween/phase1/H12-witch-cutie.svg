  <g fill="#F2C14E">
    <use href="#wstar" transform="translate(700,1180) scale(0.62)"/>
    <use href="#wstar" transform="translate(2320,1240) scale(0.7)"/>
    <use href="#wstar" transform="translate(880,760) scale(0.45)"/>
  </g>

  <!-- hair (behind face) -->
  <ellipse cx="1188" cy="1760" rx="196" ry="330" fill="#C4622D"/>
  <ellipse cx="1812" cy="1760" rx="196" ry="330" fill="#C4622D"/>
  <circle cx="1160" cy="2075" r="120" fill="#C4622D"/>
  <circle cx="1840" cy="2075" r="120" fill="#C4622D"/>

  <!-- face -->
  <circle cx="1500" cy="1660" r="336" fill="#FBE0C4"/>

  <!-- hat -->
  <path d="M 1190 1270 C 1248 940 1398 700 1560 560
           C 1662 800 1742 1058 1810 1270 Z" fill="#6B4E9E"/>
  <ellipse cx="1500" cy="1282" rx="640" ry="128" fill="#6B4E9E"/>
  <path d="M 1196 1160 L 1804 1160 L 1812 1272 L 1188 1272 Z" fill="#9B7BD4"/>
  <use href="#wstar" transform="translate(1500,1216) scale(0.62)" fill="#F2C14E"/>

  <!-- features -->
  <path d="M 1338 1650 Q 1392 1572 1446 1650" fill="none"
        stroke="#3B2A4A" stroke-width="26" stroke-linecap="round"/>
  <path d="M 1554 1650 Q 1608 1572 1662 1650" fill="none"
