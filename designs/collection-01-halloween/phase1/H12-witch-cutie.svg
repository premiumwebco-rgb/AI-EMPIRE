  <!-- {CHILD_NAME} -->
  <text x="1500" y="2560" font-size="330" font-weight="700"
        fill="#6B4E9E" text-anchor="middle">Amelia</text>

</g>
<!-- LIGHT-INK SWAP for black totes: #6B4E9E -> #C9B3F0, #3B2A4A features stay -->
</svg>
