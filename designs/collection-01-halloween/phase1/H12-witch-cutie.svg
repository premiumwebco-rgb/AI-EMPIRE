  <circle cx="1300" cy="1762" r="62" fill="#F5A9A0"/>
  <circle cx="1700" cy="1762" r="62" fill="#F5A9A0"/>
  <path d="M 1424 1780 Q 1500 1866 1576 1780" fill="none"
