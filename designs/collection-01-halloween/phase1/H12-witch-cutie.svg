<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
<!--
  DESIGN ID:   H12 |  Witch Cutie
  COLLECTION:  01 Halloween (PRIORITY 1)  |  Tote bag, 10" x 10" @ 300 DPI
  SAFE ZONE:   150-2850  |  Transparent background  |  Fredoka + Nunito (OFL)
  BUYER:       Parent of a girl 4-9. Soft "girl-coded" option; pairs with H11.
  PERSONALIZATION: {CHILD_NAME}
-->
<defs>
  <polygon id="wstar" points="0,-100 23.5,-30.9 95.1,-30.9 37.8,11.8 58.8,80.9 0,38.2
                              -58.8,80.9 -37.8,11.8 -95.1,-30.9 -23.5,-30.9"/>
</defs>
<g font-family="Fredoka, Nunito, sans-serif">

  <text x="1500" y="430" font-family="Nunito, sans-serif" font-size="126" font-weight="700"
